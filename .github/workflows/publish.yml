# Builds abi3 wheels (one per platform, valid for every Python 3.10+ per Cargo.toml's
# `abi3-py310` feature: no per-Python-version build matrix needed) plus an sdist, then
# publishes to PyPI via Trusted Publishing (OIDC) on a release-please tag. No PyPI API
# token exists anywhere in this repo; `id-token: write` is the only auth it needs.
# The same platform set builds the tors-documents payload wheel (the `tors[documents]`
# extra's payload) in its own jobs, uploading from its own Trusted Publishing identity.
#
# Platform set is the mainstream cross-platform tier most serious PyO3 packages ship
# (Linux manylinux + musllinux on x86_64/aarch64, macOS x86_64/aarch64, Windows x64/arm64)
# (not maturin generate-ci's full exotic-target sprawl (32-bit x86, armv7, s390x, ppc64le,
# emscripten, android), which stays out until a real user asks for one of those.
#
# Tag-trigger caveat: release-please publishes its tag using GITHUB_TOKEN by default, and
# GitHub does not start workflow runs from GITHUB_TOKEN-authored events, so this workflow's
# `push: tags` trigger will not fire automatically unless release-please.yml is given a
# GitHub App token (see that workflow's header). Until one is configured, run this via
# `workflow_dispatch` against the new tag after a release PR merges.
#
# Job order is deliberately cheapest-first: wheels-linux (and sdist) run on ubuntu-22.04,
# by far the cheapest and fastest GitHub-hosted runner. wheels-other (macOS, Windows,
# both several times the per-minute cost of Linux, and macOS/Windows arm64 runners are
# scarcer capacity) only starts once every Linux leg has passed, via `needs`. A correctness
# bug that fails on Linux therefore never burns the expensive runners at all.

name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  wheels-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: auto
          - target: aarch64
            manylinux: auto
          - target: x86_64
            manylinux: musllinux_1_2
          - target: aarch64
            manylinux: musllinux_1_2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every checkout in this workflow materializes the git-LFS
          # fixtures (tests/corpus/, tests/engines_corpus/; see
          # .gitattributes and ci.yml's test-job note for the flag): the
          # sdist job packs the package tree and publish-crate packs the
          # crate, so both embed the fixture bytes, and a pointer-file
          # checkout would ship LFS pointers where those bytes belong.
          # The other jobs' artifacts embed no fixtures (wheels wrap
          # compiled code; the asserts read manifest text), but the flag
          # costs seconds per job: one uniform policy beats per-job
          # archaeology over what maturin/cargo will pack next.
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      # lfs: the sdist embeds the LFS fixture bytes; see the
      # wheels-linux checkout note.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  wheels-other:
    needs: wheels-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
            python_arch: x64
          - os: windows-11-arm
            target: aarch64
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true # uniform policy; see the wheels-linux checkout note.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch || 'x64' }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish:
    name: Publish to PyPI
    needs: [wheels-linux, wheels-other, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing: no API token secret needed or used.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Publish
        run: uv publish --trusted-publishing automatic dist/*

  # The tors-documents payload wheel: the `pip install tors[documents]` extra's
  # payload, built from tors-documents/ through that directory's own
  # pyproject.toml/Cargo.toml (maturin-action's working-directory input). The
  # payload crate is deliberately NOT a cargo workspace member and resolves
  # tors-core as a path dependency with its `documents` feature ON, so the
  # engines compile here and nowhere else.
  #
  # VERSION LOCK: tors-documents carries the SAME version number as the base
  # tors wheel, and the two release together; release-please bumps both
  # pyproject.tomls (and both Cargo.tomls) in one release PR via
  # release-please-config.json's extra-files. The assert in publish-documents
  # below turns any drift into a build failure before a file reaches PyPI.
  # the tors[documents] extra pins the payload by minor
  # (`tors-documents==X.Y.*`, rewritten on every bump by
  # release-lock-sync.yml), so a version drift beyond the minor, or a pin
  # left a minor behind by a release PR, fails the gate instead of shipping.
  #
  # No payload sdist, deliberately: the payload's tors-core dependency is a
  # PATH dependency outside the tors-documents/ package directory, and an
  # sdist archives only the package: a tors-documents sdist could not build
  # from source. The payload ships wheels; the base sdist plus the published
  # payload wheel is the full install story.
  wheels-linux-documents:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: auto
          - target: aarch64
            manylinux: auto
          - target: x86_64
            manylinux: musllinux_1_2
          - target: aarch64
            manylinux: musllinux_1_2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true # uniform policy; see the wheels-linux checkout note.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          working-directory: tors-documents
      # Named documents-wheels-* so the base publish job's "wheels-*" artifact
      # pattern cannot sweep these up: the two projects upload from separate
      # jobs, each with its own Trusted Publishing identity.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documents-wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  wheels-other-documents:
    needs: wheels-linux-documents
    # Same cheapest-first ordering as the base wheel jobs (see the header).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
            python_arch: x64
          - os: windows-11-arm
            target: aarch64
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true # uniform policy; see the wheels-linux checkout note.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch || 'x64' }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: tors-documents
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documents-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish-documents:
    name: Publish tors-documents to PyPI
    # Trusted Publishing, the same mechanism as the base publish job; the
    # tors-documents PyPI project needs its own trusted publisher configured
    # (repo AZX-PBC-OSS/tors, workflow publish.yml, environment pypi; a
    # PENDING publisher can be set up before the first release, so no API
    # token is ever needed here either).
    needs: [wheels-linux-documents, wheels-other-documents]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing: no API token secret needed or used.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true # uniform policy; see the wheels-linux checkout note.
      - name: Assert version lockstep with base tors
        # The VERSION-LOCK rule enforced at the gate (see the documents-wheel
        # jobs' header comment): same version, one release, two wheels. Two
        # further couplings the version compare alone cannot see:
        # (i) the extra's payload pin: pyproject.toml's
        # `tors-documents==X.Y.*` must track THIS release's version or pip
        # co-installs a stale payload (release-lock-sync.yml rewrites the
        # pin on every bump; this catches it missing the release PR);
        # (ii) pyo3 parity: the base and payload manifests declare pyo3
        # independently and dependabot updates them as separate cargo
        # directories, so without this check nothing stops two pyo3
        # versions linking into the payload wheel's extension.
        run: |
          base="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          payload="$(sed -n 's/^version = "\(.*\)"$/\1/p' tors-documents/pyproject.toml | head -n1)"
          pin="$(sed -n 's/^documents = \["tors-documents==\(.*\)\.\*"\]$/\1/p' pyproject.toml | head -n1)"
          pyo3_root="$(sed -n '/^name = "pyo3"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)"
          pyo3_payload="$(sed -n '/^name = "pyo3"$/{n;s/^version = "\(.*\)"$/\1/p;}' tors-documents/Cargo.lock)"
          echo "tors ${base}, tors-documents ${payload}, extra pin ${pin}.*, pyo3 root ${pyo3_root} / payload ${pyo3_payload}"
          test "$base" = "$payload"
          test -n "$pin"
          test "$pin" = "${base%.*}"
          test -n "$pyo3_root"
          test -n "$pyo3_payload"
          test "$pyo3_root" = "$pyo3_payload"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "documents-wheels-*"
          path: dist
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Publish
        run: uv publish --trusted-publishing automatic dist/*

  publish-crate:
    name: Publish to crates.io
    # Independent of the PyPI leg above: the crate (published as `tors-core`, see
    # Cargo.toml's own comment on the name collision) needs no wheel artifacts, just the
    # source tree and Cargo.lock, so it runs in parallel rather than behind `needs`.
    #
    # First release only: crates.io has no PyPI-style "pending trusted publisher" for a
    # crate that has never been published, so the very first `tors-core` release must be
    # `cargo publish`d manually (from a machine already `cargo login`-ed). Only after that
    # succeeds can a Trusted Publisher be configured in the crate's crates.io settings
    # (GitHub owner `AZX-PBC-OSS`, repo `tors`, workflow `publish.yml`), and this job is that
    # configuration's target and does nothing until it exists.
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # Trusted Publishing (OIDC): no API token secret needed or used.
    steps:
      # lfs: `cargo publish` packs the crate the same way the sdist job
      # packs the package tree: the fixture bytes must be real, not
      # pointer files (see the wheels-linux checkout note).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        # --no-default-features: `extension-module` (the crate's default) doesn't link
        # libpython, which breaks a plain `cargo publish` verification build the same way
        # it breaks `cargo test`/`cargo build`; see Cargo.toml's own feature comment.
        #
        # Lockfile self-heal: a release tag can carry a Cargo.lock whose root-package
        # version predates the release PR's version bump (release-please bumps
        # versions without refreshing locks), and cargo rewrites that one field on
        # first contact, which `cargo publish`'s clean-tree gate would otherwise
        # reject. The assert below keeps the gate's spirit: anything dirty OTHER
        # than Cargo.lock still aborts, and only then does --allow-dirty cover
        # cargo's own bookkeeping.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git diff --exit-code -- . ':!Cargo.lock'
          cargo publish -p tors-core --no-default-features --allow-dirty
