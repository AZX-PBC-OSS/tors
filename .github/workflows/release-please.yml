# release-type is `python`: it bumps pyproject.toml's [project].version and CHANGELOG.md
# from Conventional Commits; never hand-edit either. release-please-config.json's
# `extra-files` entries additionally bump, to the same value in the same release PR:
# Cargo.toml's [package].version (the `tors-core` crate published to crates.io),
# tors-documents/Cargo.toml's and tors-documents/pyproject.toml's versions (the
# `tors-documents` payload wheel, version-locked to `tors`: one release, two wheels;
# publish.yml's publish-documents job asserts the lockstep before uploading), so the
# registries never drift apart. The two Cargo.locks' own version fields for their
# packages self-heal on the next `cargo build`, and release-lock-sync.yml refreshes
# them on the release PR itself — publish.yml's wheel builds pass `--locked`, so the
# tag's locks must already be fresh (that sync is what makes them so).
#
# Release-cut policy (recorded here because release-please-config.json is JSON and
# cannot carry a comment): the config's `changelog-sections` mirrors the python
# release type's built-in sections with ONE delta — `chore` is un-hidden. Under the
# built-in sections a chore-only stream (the chore(deps)/chore(deps-rust)/
# chore(deps-py) dependency revs) renders an empty changelog, and an empty changelog
# means NO release PR at all, so a deps rev would sit unreleased until the next
# feat/fix happened to land. With the section visible, those revs cut patch releases
# of their own. `perf` needs no override: it is already a visible "Performance
# Improvements" section in the python type's defaults and bumps the patch version
# (the lsh perf commit shipped in 0.16.0's changelog). style/refactor/test/build/ci
# stay hidden on purpose — internal-hygiene commits do not ship.
#
# GitHub does not start workflow runs from events raised with the default GITHUB_TOKEN, so
# a tag released this way will not auto-trigger publish.yml's `push: tags` step; see that
# workflow's header. The App path below is optional; without it, run publish.yml manually
# (workflow_dispatch) after a release PR merges. Set both or neither:
#   vars.RELEASE_PLEASE_APP_ID              App ID of the installed GitHub App
#   secrets.RELEASE_PLEASE_APP_PRIVATE_KEY  its PEM private key
# The App needs `contents: write` and `pull_requests: write` on this repo.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint a GitHub App token (optional)
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # config-file/manifest-file (not a bare release-type input): the extra-files
          # entries in release-please-config.json are what bump Cargo.toml's,
          # tors-documents/Cargo.toml's, and tors-documents/pyproject.toml's versions
          # alongside pyproject.toml's; that customization needs manifest mode.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Warn that publish.yml cannot auto-trigger
        if: ${{ steps.release.outputs.release_created == 'true' && steps.app-token.outputs.token == '' }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "::warning::Release ${TAG_NAME} was published with GITHUB_TOKEN, which cannot start workflow runs. publish.yml's tag-push trigger did NOT fire. Run it manually: Actions -> publish -> Run workflow, using tag ${TAG_NAME}. The release PR's commits were also GITHUB_TOKEN-authored, so release-lock-sync.yml's triggers were suppressed too - check the tag's locks are fresh first (see the step summary)."
          {
            echo "### Release ${TAG_NAME} published: PyPI publish not triggered automatically"
            echo
            echo "**Action required:** Actions -> publish -> Run workflow (workflow_dispatch)."
            echo
            echo "**Stale-locks hazard first:** the release PR was GITHUB_TOKEN-authored, so"
            echo "release-lock-sync.yml's pull_request and push triggers were both suppressed with"
            echo "it. If the release PR carries no \`chore: sync lockfiles and documents pin\`"
            echo "commit, the tag's uv.lock/Cargo.lock are stale and publish.yml's \`--locked\`"
            echo "wheel builds will fail. Fix: run Actions -> release-lock-sync -> Run workflow"
            echo "against branch \`release-please--branches--main\` (it pushes the sync onto that"
            echo "branch), merge the sync commit into main, re-point ${TAG_NAME} at the new"
            echo "commit, and only then run publish."
            echo
            echo "To make all of this automatic, install a GitHub App with \`contents: write\` and"
            echo "\`pull_requests: write\`, then set \`RELEASE_PLEASE_APP_ID\` (variable) and"
            echo "\`RELEASE_PLEASE_APP_PRIVATE_KEY\` (secret)."
          } >> "$GITHUB_STEP_SUMMARY"
