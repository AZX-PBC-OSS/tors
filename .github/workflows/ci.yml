name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for debugging a workflow change without pushing a commit.
  workflow_dispatch:

# Cancel the superseded run for the same branch when a new push lands:
# rapid follow-up commits stop burning runner minutes on an already-outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job here reads and builds, none writes anything back to
# the repo or an external registry, so the top-level GITHUB_TOKEN needs no more than this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # Runs once, not per matrix leg: Rust fmt/clippy is Python-version-agnostic, so the
    # 3.10–3.14 matrix would buy five identical copies of the same signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        # The action installs with rustup's `--profile minimal`, which ships neither
        # rustfmt nor clippy — this input is what makes the two steps below runnable.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        # rust-cache, not sccache, in CI: every strategy pays its warm-up per job, and a
        # ~10s clean build never amortizes sccache's install + cache-restore overhead on
        # top of it. rust-cache already keys per job on the lockfile. sccache is wired
        # where it does pay — the local edit/compile loop, via the Makefile (which does
        # the same: sccache locally, no compiler cache in CI). The workspaces list adds
        # tors-documents/target: the payload crate is deliberately NOT a cargo workspace
        # member (its Cargo.toml's header), so it builds into its own target dir the
        # root key would never cache — the same reason the fuzz job maps fuzz/ below.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target\ntors-documents -> tors-documents/target"

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo fmt (fuzz crate)
        # The fuzz crate is intentionally not a workspace member, so the
        # root fmt gate never sees it; without this step its targets rot
        # silently (truncate_ellipsis.rs had already drifted).
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

      - name: Cargo fmt (documents payload)
        # The tors-documents payload crate is also deliberately not a cargo
        # workspace member (the fuzz-crate precedent), so the root fmt gate
        # never sees it either — `make lint` runs this same line locally.
        run: cargo fmt --check --manifest-path tors-documents/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo clippy (no default features)
        # Second pass in the configuration `Cargo test` / `Compile benches` below actually
        # build (--no-default-features): pyo3's cfg flags differ between the two configs,
        # so each pass can surface lints in code the other never compiles.
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Cargo clippy (documents feature)
        # Third pass, in the documents configuration the payload wheel builds
        # (tors-core with the `documents` feature on): the cfg-gated engine
        # surface (documents_impl/pdf_impl/gfm_strip_impl and its unit tests)
        # is code the two configs above never compile — the same reason the
        # no-default-features pass exists.
        run: cargo clippy --all-targets --no-default-features --features documents -- -D warnings

      - name: Cargo clippy (documents payload)
        # The tors-documents payload crate's own bindings, through its own
        # manifest (it is deliberately not a workspace member, so root clippy
        # never sees it — the fuzz-crate precedent). No --features spelling
        # here: the payload package defines no features; its tors-core path
        # dependency already carries `documents`, so the plain manifest build
        # compiles the engine surface.
        run: cargo clippy --all-targets --manifest-path tors-documents/Cargo.toml -- -D warnings

      - name: Cargo deny (licenses, advisories, bans)
        # The repo-wide, permanent licensing gate (spec v0.4 item 6): the
        # permissive-only allowlist and the advisory/ban policy live in
        # deny.toml; `make deny` runs the same three checks locally. The
        # action ships a prebuilt cargo-deny binary, so the gate costs
        # seconds, not the minutes a `cargo install cargo-deny --locked`
        # would add to every run.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command-arguments: licenses advisories bans

      - name: Cargo deny (documents payload lock)
        # The SECOND, independent lockfile: tors-documents resolves its
        # own Cargo.lock (deliberately not a cargo workspace member — its
        # Cargo.toml's header), and that package set is not a subset of
        # the root lock's (deny.toml's [graph] comment has the measured
        # skew). Same action, same deny.toml policy, same three checks —
        # only the manifest differs.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: tors-documents/Cargo.toml
          command-arguments: licenses advisories bans

      - name: Install uv
        # For the ruff step below: ruff is a dev-group dependency (pyproject.toml),
        # so the lockfile — not this workflow — owns its version.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Ruff
        # The Python-side lint gate (config in pyproject.toml [tool.ruff];
        # `make lint` runs the same check locally). --no-install-project keeps
        # this a pure lint step: only the dev deps are installed, never the
        # tors wheel (whose maturin build is the test job's business — the
        # Rust gates above already compile the code it would wrap).
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync ruff check .

  test:
    # Cheap signals first: a fmt or clippy
    # failure surfaces from `lint` in one fast job instead of after five matrix legs have
    # each spent a uv sync + extension build on the same break.
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite's committed binary fixtures (tests/corpus/,
          # tests/engines_corpus/ — pdf/docx/xlsx/pptx/odt/…) are git-LFS
          # objects (see .gitattributes): checkout materializes them only
          # with this flag, and the corpus-drift and engine gates read
          # their bytes. The lint and fuzz jobs need no fixtures and stay
          # on the plain checkout.
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        # Same choice as the lint job's cache step (rationale there).
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cargo test
        # extension-module doesn't link libpython, so plain `cargo test` needs it off.
        # Rust-only; the crate isn't Python-version-specific, so this runs once per job
        # rather than once per matrix entry.
        if: matrix.python-version == '3.12'
        run: cargo test --no-default-features

      - name: Cargo test (documents feature)
        # The documents lane's crate-side tests (routing table, separator pins,
        # classify semantics) in the configuration the payload wheel builds —
        # the engine surface's unit tests are cfg-gated code the base config
        # above never compiles.
        if: matrix.python-version == '3.12'
        run: cargo test --no-default-features --features documents

      - name: Compile benches
        # Compile-guard only: the bench docstring (benches/normalize.rs) and the design
        # spec both promise that CI compiles the criterion benches; `--no-run` keeps that
        # promise without spending runner time executing them. `--no-default-features`:
        # same libpython-linking reason as `Cargo test` above — a bench binary links the rlib.
        if: matrix.python-version == '3.12'
        run: cargo bench --no-run --no-default-features

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies and build the extension
        # --locked: fail if uv.lock is out of date with pyproject.toml, rather than silently
        # rewriting it. --extra documents: the tors[documents] payload wheel (the uv
        # workspace member tors-documents/): the pytest suite's documents gates
        # (tests/test_documents_engines.py, tests/test_pdf.py) run against the payload,
        # and a plain `uv sync --locked` is EXACT — it would uninstall the payload and
        # silently skip those gates (the same reason `make install`/`make dev` always
        # carry the extra).
        run: uv sync --locked --extra documents

      - name: Pytest
        # -m "not timing and not sweep": two lanes are deselected here and
        # run ONCE on the 3.12 leg (steps below) instead of on all five
        # matrix legs:
        #   - timing: the load-sensitive measurement cells
        #     (tests/test_gil_release.py, tests/test_performance.py).
        #   - sweep: the 67k-cell exhaustive structural parity battery in
        #     tests/test_json_repair_parity.py — extension-parity against
        #     the json_repair oracle, identical on every Python version.
        # The marker split is exact (every lane cell carries its marker),
        # so no test loses its lane — verified by `pytest --collect-only`
        # per lane summing to the unfiltered count.
        # NO -rP on this step. -rP makes pytest retain the captured stdout
        # of every passing test; at ~70k items the fast lane measured 17.5s
        # without it and was still running at 180s with it (locally), and
        # on CI it was the 450-955s stall at the 99% line that pushed legs
        # from ~2 min to 18-29 min. Print-for-the-record cells live in the
        # timing lane, which keeps its own -rP.
        run: uv run --no-sync pytest -q -m "not timing and not sweep"

      - name: Pytest (sweep lane)
        # The exhaustive structural parity battery the matrix legs above
        # deselect: 67k parametrized cells, Python-version-independent, so
        # one leg pays for it. Plain -q, no -rP — nothing in this lane
        # prints for the record, and -rP on a lane this size is the
        # captured-output blowup documented on the fast-lane step above.
        if: matrix.python-version == '3.12'
        run: uv run --no-sync pytest -q -m sweep

      - name: Pytest (timing lane)
        # The lane the matrix legs above deselect, run ONCE (the 3.12 leg,
        # after the main pytest step): the GIL-release and wall-time
        # measurement cells. -rP so the print-only recorded bands (and the
        # b64 battery's recorded gh-145264 divergences, should this leg's
        # stdlib predate the fix) surface in the log. Runs last on the leg so
        # a timing failure never masks the fast lane's results.
        if: matrix.python-version == '3.12'
        run: uv run --no-sync pytest -q -rP -m timing

  fuzz-smoke:
    # A cheap regression net, not a real fuzzing campaign: 15s per target
    # (CONTRIBUTING.md's `make fuzz-quick` runs the full target list for 30s
    # locally) — enough to catch a reintroduced panic on every push without
    # meaningfully lengthening CI. A real multi-hour campaign against one
    # target of active suspicion is a local `cargo +nightly fuzz run
    # <target>`, not something this job runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (nightly)
        # cargo-fuzz's instrumented builds need nightly's -Z sanitizer flags;
        # the rest of CI stays on stable (see the lint job's own note).
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target\nfuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz (15s per target)
        # The same list as the Makefile's FUZZ_TARGETS and fuzz.yml's
        # weekly pass — this loop had drifted from both (truncate_ellipsis,
        # controls, json_repair were Makefile-only). gfm_strip joined the
        # lists when its char-boundary fence-trim panic was fixed
        # (strip_fence_content, unit-pinned). documents_markdown stays
        # deliberately absent: it SIGSEGVs on a KNOWN upstream bug
        # (pdf_oxide 0.3.78 parse_object/parse_array recursion, no depth
        # cap) — the Makefile's FUZZ_TARGETS comment carries the repro.
        # It stays built and committed as the repro harness, joining the
        # run lists when pdf_oxide ships a cap.
        working-directory: fuzz
        run: |
          set -e
          for t in decode_utf8 decode_utf16 b64_decode html_unescape fence chunk_hierarchical normalize search segmentation diff grounded phonetic bm25 tfidf truncate_ellipsis controls json_repair gfm_strip; do
            echo "=== $t ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=15 -close_fd_mask=3
          done
