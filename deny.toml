# cargo-deny configuration — the repo-wide, permanent licensing gate (spec
# v0.4 item 6). The allowlist is permissive-only: MIT, Apache-2.0,
# BSD-2/3-Clause, ISC, Zlib. No GPL/LGPL/AGPL/MPL, no unlicensed, nothing
# else. Dual-licensed crates ("MIT OR Apache-2.0", memchr's "MIT OR
# UNLICENSE") pass when any one branch is allowed — SPDX expression
# evaluation, not string matching.
#
# Run locally with `make deny` (cargo deny check licenses advisories bans);
# CI runs the same three checks in the lint job (see .github/workflows/ci.yml).
# Every dependency's license is also recorded in the README's dependency
# table — this file is the enforcement, that table is the human-readable
# record.

[graph]
# All cargo features of the workspace package resolve into the checked
# graph, not just the default set. The `documents` feature is default-OFF
# (the base wheel builds without it; the tors-documents payload wheel is
# the only build that turns it on), so a default-features graph would
# license-check none of the engine tree — pdf_oxide/anydoc/office_oxide/
# html-to-markdown-rs and their ~130 transitive packages. Resolution is
# metadata-only (nothing links), so `extension-module` being co-enabled is
# harmless. The payload crate resolves its own INDEPENDENT lockfile
# (tors-documents/Cargo.lock — the crate is deliberately not a cargo
# workspace member, its Cargo.toml's header), and that lock's package set
# is NOT a subset of this one's: it carries packages and versions the
# root lock never resolves (measured 2026-09: 6 payload-only names, among
# them the payload's whole multiversion lane, plus 8 version-skewed
# pairs). Both lockfiles are therefore gated — the root graph here, and a
# second run over the payload manifest (`cargo deny --manifest-path
# tors-documents/Cargo.toml check licenses advisories bans`, wired in
# ci.yml's lint job and `make deny`).
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Additions beyond the spec's literal list, each flagged the first time
    # `cargo deny check` met it in the actual tree and each a permissive
    # grant inside the gate's stated intent ("permissive only; no
    # GPL/LGPL/AGPL/MPL, no unlicensed") — recorded here so the deviation
    # is visible, not silent:
    #
    # - Apache-2.0 WITH LLVM-exception: target-lexicon (a pyo3 build
    #   dependency, therefore unavoidable behind pyo3). The LLVM-exception
    #   REMOVES attribution obligations from Apache-2.0 in specific cases —
    #   strictly more permissive than the plain Apache-2.0 already allowed.
    # - Unicode-3.0: unicode-ident ((MIT OR Apache-2.0) AND Unicode-3.0, a
    #   proc-macro2 dependency), the permissive license the Unicode
    #   Consortium publishes the UCD data under. The Rust ecosystem's
    #   unicode-rs crates adopted it for their generated tables.
    # - 0BSD: enum-iterator / enum-iterator-derive (rphonetic's phonetic-code
    # dependencies, for soundex/metaphone), and adler2 (a miniz_oxide
    # dependency in the documents engine tree). The BSD Zero Clause License
    # is OSI-approved and public-domain-equivalent — strictly more
    # permissive than plain MIT (it drops even the attribution
    # requirement).
    # - MIT-0: borrow-or-share (a fluent-uri dependency, pulled in by the
    # jsonschema crate's `referencing` $ref machinery). MIT No Attribution
    # is plain MIT with the attribution obligation REMOVED — strictly more
    # permissive than the MIT already allowed, the same family as 0BSD
    # above.
    # - CC0-1.0: tiny-keccak (a documents-engine-tree dependency:
    #   html-to-markdown-rs → ahash's `compile-time-rng` feature →
    #   const-random → const-random-macro → tiny-keccak, the Keccak
    #   permutation behind the macro's compile-time RNG). CC0 1.0 is a
    #   public-domain dedication — no conditions at all, strictly more
    #   permissive than the 0BSD already allowed. (Not OSI-approved as a
    #   license precisely because it dedicates rather than licenses; inside
    #   this gate's "permissive only" intent all the same.)
    # - NCSA: libfuzzer-sys ((MIT OR Apache-2.0) AND NCSA), the fuzz
    #   crate's harness — the AND conjunct is LLVM's libFuzzer C++ sources
    #   it embeds, which the University of Illinois/NCSA Open Source
    #   License (LLVM's own license, OSI-approved) governs: a BSD-style
    #   permissive grant, the LLVM-exception family already allowed above.
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "NCSA",
]
# The allowlist is policy, not a measurement of today's tree: BSD-2/3-Clause,
# ISC, and Zlib are allowed for future dependencies before any of them is
# actually pulled in, so "allowed but not yet encountered" is not a finding.
unused-allowed-license = "allow"

[advisories]
version = 2
ignore = [
    # RUSTSEC-2026-0192 (`ttf-parser` unmaintained): an unconditional
    # transitive of BOTH documents engines' PDF stacks — pdf_oxide 0.3.78's
    # own font parsing and anydoc's pdf-inspector — so neither a bump inside
    # this repo nor a feature toggle can remove it, and the advisory itself
    # states no safe upgrade exists (the suggested alternative, skrifa, is
    # already in pdf_oxide's tree alongside it; migrating to it is pdf_oxide
    # upstream's move, tracked by their harfbuzz/ttf-parser#217 announcement).
    # Unmaintained-informational, not a vulnerability: the crate parses font
    # tables out of PDFs tors never authors, and pdf_oxide's published
    # benchmark (100% over the 3,830-PDF veraPDF/pdf.js/SafeDocs corpora)
    # is the operative safety evidence. Revisit when pdf_oxide ships a
    # ttf-parser-free release.
    { id = "RUSTSEC-2026-0192", reason = "unconditional transitive of pdf_oxide/anydoc's PDF stacks; unmaintained-informational, no safe upgrade; upstream (pdf_oxide) owns the skrifa migration" },

    # RUSTSEC-2026-0367 / -0368 / -0369 (zip 8.x extraction vulnerabilities:
    # SUID/SGID preservation, symlink escape on `ZipArchive::extract`,
    # permissions applied through symlinks), all patched in zip >=9.0.0. zip
    # 8.6.0's only entry paths are anydoc 0.2.4 and office_oxide 0.1.11 in
    # the documents engine tree, and neither touches the vulnerable surface:
    # both read archives in memory (ZipArchive::new over Cursor, mmap, or
    # File readers, with by_name/by_index entry reads) and assemble packages
    # with ZipWriter, which is outside all three advisories' scope. Neither
    # crate calls `extract()`, `ZipStreamReader`, or any disk-targeting
    # extraction (verified against both vendored crate sources; tors's own
    # code has zero direct zip usage). No shipped upstream release moves
    # either crate to zip 9: anydoc maxes at 0.2.4, and office_oxide 0.1.15's
    # own zip-9 bump doesn't remove zip 8.6 while anydoc 0.2.4 pins ^8.6.0,
    # so no version bump available in this repo clears the advisories. Lift
    # when anydoc ships a zip-9-compatible release, or both crates leave the
    # graph.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 via anydoc 0.2.4 / office_oxide 0.1.11 in-memory archive reads, ZipWriter assembly (out of advisory scope); extract() never called; no zip-9 release exists upstream" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 via anydoc 0.2.4 / office_oxide 0.1.11 in-memory archive reads, ZipWriter assembly (out of advisory scope); extract() never called; no zip-9 release exists upstream" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 via anydoc 0.2.4 / office_oxide 0.1.11 in-memory archive reads, ZipWriter assembly (out of advisory scope); stream extract never called; no zip-9 release exists upstream" },
]

[bans]
# Multiple versions of one crate are a warning, not a denial: the dev-tree
# (criterion and friends) legitimately pulls overlapping versions, and
# denying there would be noise without protecting anything — the runtime
# dependency set is small enough to eyeball on every bump (README table).
multiple-versions = "warn"
