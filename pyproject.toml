[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tors"
version = "0.6.0"
description = "Fast, GIL-free text and document operations for Python — normalization, Unicode segmentation, diffing, fuzzy matching, chunking, encoding/near-dup detection, Merkle integrity, and URL/redaction utilities, backed by Rust."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AZX, PBC." }]
maintainers = [{ name = "AZX, PBC." }]
keywords = [
    "text",
    "unicode",
    "gil-free",
    "free-threading",
    "rust",
    "normalization",
    "chunking",
    "diff",
    "fuzzy-matching",
    "tokenization",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# The real PyPI extra the documents surface rides on: the tors-documents
# payload wheel (tors-documents/, version-locked to this package — one
# release, two wheels, release-please bumps them together). The base wheel
# ships only the tors.documents shim; `pip install tors[documents]` pulls
# the compiled extraction surface in. The payload is PINNED to this
# package's minor (`==X.Y.*`): the tors-documents name is unregistered on
# PyPI, so an unpinned extra is a squatting race (whoever registers the
# name first satisfies every existing install) and a permanent skew
# (tors 0.5 co-installing tors-documents 0.7) — the pin plus the
# version-lockstep assert in publish.yml close both. Locally the extra
# resolves through the uv workspace (below), never from an index, so the
# pin is inert in dev; release-lock-sync.yml rewrites it on every
# release bump (release-please's extra-files only touches version lines,
# not this one).
[project.optional-dependencies]
documents = ["tors-documents==0.6.*"]

[project.urls]
Homepage = "https://github.com/AZX-PBC-OSS/tors"
Repository = "https://github.com/AZX-PBC-OSS/tors"
Changelog = "https://github.com/AZX-PBC-OSS/tors/releases"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    # json-repair is the exact-pinned differential oracle for tests/test_json_repair.py (a version bump is a deliberate parity re-sync); jsonschema is that suite's schema-mode runtime.
    "json-repair==0.63.4",
    "jsonschema>=4.21",
    "maturin>=1.15.0",
    # The document WRITERS behind tests/docgen.py's randomized lane: real
    # format bytes from the standard maintained generators (real Word
    # styles/numbering, real pptx layouts/notes parts, real xlsx
    # shared-strings, real PDF content streams/link annotations), so the
    # cross-format validation suite measures the engines against what
    # actual authoring tools emit — not hand-built minimal subsets (the
    # committed corpus keeps those, byte-deterministically; this lane is
    # seeded-random and never committed, so writer nondeterminism is
    # harmless). Dev-group only: none of these ship in any wheel.
    "fpdf2>=2.8",
    # the encrypted-PDF fixture generator for the password= gates (fpdf2
    # writes the born-digital page, pypdf wraps it in an RC4-128 standard
    # security handler — pure-python in pypdf, where AES would drag in the
    # cryptography package this dev group does not carry)
    "pypdf>=6.9",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    # pydantic v2 drives the model -> schema -> repair -> model_validate
    # end-to-end tests (tests/test_json_repair_e2e.py); the repair functions
    # also accept models directly at runtime.
    "pydantic>=2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.uv]
default-groups = ["dev"]
# The payload crate as a uv workspace member: `tors[documents]` (the extra
# above) resolves it from THIS tree — never from an index — so `uv sync
# --extra documents` builds and installs the extraction surface locally.
# A uv-workspace membership is independent of cargo's: tors-documents
# deliberately stays OUT of the cargo workspace (its Cargo.toml's header)
# so root cargo commands never see the `documents` feature.
workspace = { members = ["tors-documents"] }

[tool.uv.sources]
tors-documents = { workspace = true }

[tool.maturin]
python-source = "python"
module-name = "tors._tors"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_aio.py imports tools/gen_aio_stub.py directly (to check the
# committed aio.pyi against the generator's own current output), so tools/
# needs to be importable the same way tests/ already is via testpaths.
pythonpath = ["tools"]
markers = [
    # The timing lane: the measurement cells of tests/test_gil_release.py and
    # tests/test_performance.py (asyncio heartbeat-gap bands and wall-time
    # bands) — slow and load-sensitive. CI's matrix legs run
    # `-m "not timing"` and ONE dedicated step on the 3.12 leg runs
    # `-m timing`, so the GIL/perf contracts still gate every push without
    # paying the lane five times; locally `pytest` (and `make test`) run
    # everything, marker or not.
    "timing: measurement cell (GIL heartbeat-gap / wall-time band) — the slow, load-sensitive lane; CI runs it once on the 3.12 leg",
    # The sweep lane: the 67k-cell exhaustive structural parity battery in
    # tests/test_json_repair_parity.py (L<=6 over the structural alphabet,
    # parametrized). It is extension-parity against the json_repair oracle —
    # Python-version-independent, so CI runs it once on the 3.12 leg instead
    # of on all five matrix legs; locally `pytest` (and `make test`) run
    # everything, marker or not.
    "sweep: exhaustive structural parity cell — the Python-version-independent battery; CI runs it once on the 3.12 leg",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W/F (pycodestyle/pyflakes), I (import order — the suite's `noqa: I001`
# comments cite it), B (bugbear), UP (pyupgrade), BLE (blind-except — the
# `noqa: BLE001` comments in test_b64_decode.py cite it): the codes the
# existing noqa comments cite are all enforced, so those suppressions stay
# meaningful.
select = ["E", "W", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.isort]
# tors (the package under test) and reference (the tests' shared oracle
# module) are first-party, so their imports keep their own section after the
# third-party block — the layout every test file already uses.
known-first-party = ["tors", "reference", "documents"]
