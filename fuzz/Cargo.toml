[package]
name = "tors-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
# The normalize target's independent digest oracle: the same crates (and
# versions) the main crate uses for finalize's hash, so the fuzz check
# hashes exactly the way the code under test does. The version pins track
# the root Cargo.toml's by hand (sha2 0.11 / const-hex 1.19, matching
# Cargo.toml's own dependency lines) — a root bump needs the same bump
# here or this comment is a lie; dependabot's /fuzz lane ignores these
# three for exactly that reason (see .github/dependabot.yml).
sha2 = "0.11"
const-hex = "1.19"
# The chunk_hierarchical target's independent cluster oracle: the same
# crate (and version) the main crate's grapheme machinery runs on, so the
# fuzz check answers "is this a cluster boundary" exactly the way
# production's tables do, without trusting the code under test to
# re-answer its own question. Same hand-synced-to-root pin discipline as
# sha2/const-hex above.
unicode-segmentation = "1.13.3"
# The unescaped target's find-loop oracle uses the same one-shot memmem
# search the Python reference's `bytes.find` spells (hand-synced to the
# root memchr pin; occurrence search only — the parity walk stays
# independent).
memchr = "2.8.3"

[dependencies.tors]
# The crates.io package is `tors-core` (the plain `tors` name is an unrelated,
# dormant crate — see the main Cargo.toml's own comment); `package` renames the
# dependency back to `tors` locally so every fuzz target's `use tors::...` stays
# unchanged.
package = "tors-core"
path = ".."
# The library target only: pulling in `extension-module` would try to link
# libpython, which a bare fuzz binary neither has nor needs (the same reason
# `cargo test`/`cargo build` on this crate run --no-default-features).
default-features = false
# The documents engines ON: without the feature the whole document-parsing
# surface (documents_impl/pdf_impl/gfm_strip_impl) is cfg-gated out of every
# fuzz binary, unreachable from any target — the red-team finding behind the
# documents_markdown/gfm_strip targets. The engines compile into every
# target's binary (cargo features are crate-wide, not per-target), the same
# lean-base trade the tors-documents payload wheel makes in the opposite
# direction.
features = ["documents"]

[[bin]]
name = "decode_utf8"
path = "fuzz_targets/decode_utf8.rs"
test = false
doc = false
bench = false

