[package]
# crates.io already has an unrelated, dormant `tors` crate (a 2017 multidimensional-array
# lib, last published 0.1.0) — that name isn't available, so the Rust crate publishes as
# `tors-core`. The Python package (PyPI, and the compiled extension module Python imports)
# stays `tors`: `[lib] name` below is independent of `[package] name` and is what actually
# governs the built library's name, so this rename has no effect on the Python-facing API.
name = "tors-core"
version = "0.7.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Fast, GIL-free text and document operations for Python: normalization, Unicode segmentation, diffing, fuzzy matching, chunking, encoding/near-dup detection, Merkle integrity, and URL/redaction utilities, backed by Rust."
readme = "README.md"
repository = "https://github.com/AZX-PBC-OSS/tors"
keywords = ["text", "unicode", "pyo3", "gil-free", "normalization"]
categories = ["text-processing", "encoding"]

[lib]
name = "tors"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310 builds against the stable CPython ABI floor (matches requires-python in
# pyproject.toml): one wheel per platform runs on every Python 3.10+ release rather than
# needing a wheel built per minor version.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
unicode-normalization = "0.1"
# finalize's content hash: sha256 over the normalize result's UTF-8 bytes, lowercase hex:
# byte-identical to hashlib.sha256(...).hexdigest(), the expression a normalize-then-hash
# dedupe gate computes.
sha2 = "0.11"
# The one-shot hashing surface (`src/hash_impl.rs`): the same RustCrypto
# family sha2 already comes from, so one dependency line per algorithm and
# nothing hand-rolled (a digest implementation is the worst kind of
# hand-rolling: every line is a maintenance burden and a correctness risk
# the maintained crates already carry test vectors against). md-5/sha1:
# checksum/ETag/legacy-interop only, never security (broken since the
# 2000s; the docs carry the note everywhere they are named). default-
# features = false: the digest computation needs none of the crates' std
# conveniences (the sha2 line above predates this surface and keeps its
# own default for finalize's in-scan hasher; feature unification is
# per-crate, so these lines only govern their own crates).
md-5 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
# hmac_sha256_hex's HMAC construction (RFC 2104) over the sha2 engine: the
# request-signing primitive (webhook signatures, AWS SigV4-style chains).
# default-features = false: same reasoning as md-5/sha1 above.
hmac = { version = "0.13", default-features = false }
# hex-encoding of that digest: const-hex is the maintained drop-in for the `hex` crate
# (no release since 2020, open "Unmaintained?" issue), same `encode(bytes) -> String`
# call shape.
const-hex = "1.19"
# simd-unsafe is NOT enabled (it is in this crate's default feature set, so
# it needs default-features = false to avoid): the general_purpose engine
# that src/b64_impl.rs uses never runs the crate's SIMD kernels (its
# internal_encode passes a no-op SIMD prefix; decode doesn't use the crate's
# vector engine at all), so the feature bought no speedup — its only effect
# was disabling the crate's forbid(unsafe_code) and shipping upstream unsafe
# code for nothing. `std` alone keeps the crate all-safe on tors's behalf
# (the rest of src/ is zero-unsafe).
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
unicode-segmentation = "1.13.3"
memchr = "2.8.3"
# utf8_is_valid's SIMD validity scan: "0.1" is the caret floor
# (>= 0.1.0, < 0.2), so a hypothetical 0.2 with new semantics cannot arrive
# through a plain `cargo update`. Maintenance (the spec's
# module decision): the crate is MIT OR Apache-2.0, zero dependencies, and
# its release line has been quiet since 2024-09-22 (0.1.5) while the repo
# itself stays active (commits into 2026-06): a mature, stable algorithm
# (UTF-8 validation does not churn), not an abandoned one.
simdutf8 = "0.1"
similar = "3.2.0"
# find_patterns' multi-pattern search engine (v0.7). Dual-licensed "Unlicense OR
# MIT": MIT is the elected branch (recorded in the README's dependency table;
# cargo-deny's SPDX expression evaluation accepts the election, the same way
# memchr's MIT OR UNLICENSE passes). By BurntSushi, and the Aho-Corasick
# automaton inside Rust's own `regex` crate, the most battle-tested engine
# available for exactly this job; it was already in the lock as regex's
# transitive (via criterion), so making it direct added no new package.
# "1" is the caret floor (>= 1.0.0, < 2.0.0). Match semantics pinned at
# MatchKind::LeftmostLongest, the documented behavior the Python contract
# tests differential against.
aho-corasick = "1"
# merkle_root/merkle_diff's tree structure. MIT/Apache-2.0 dual-licensed,
# generic over a `Hasher` trait: tors supplies its own domain-separated
# SHA-256 `Hasher` (src/merkle_impl.rs) rather than the crate's built-in
# `algorithms::Sha256`, whose default hashing does NOT domain-separate leaf
# and internal-node hashes (verified against the vendored source, not just
# the docs); see merkle_impl.rs's module doc for the full reasoning.
# Default features are just `std` (pulls `sha2` 0.10.x — a second major
# version alongside the direct sha2 0.11 above, so a new transitive crate,
# though a small one from the already-audited RustCrypto family); the
# `keccak256` feature (an optional `tiny-keccak` dependency) is left
# disabled, unused.
rs_merkle = "1.5"
fastcdc = "5.0.0"
# detect_encoding's guesser (the engine Firefox ships) plus the crate whose
# `&'static Encoding` it returns: chardetng doesn't re-export it, so calling
# `.name()` on the guess needs encoding_rs named directly; already pulled in
# transitively by chardetng, so this adds no new package to the tree, only a
# direct edge to one already resolved.
chardetng = "1.0.0"
encoding_rs = "0.8"
rust-stemmers = "1.2.0"
# `embedded_dm` embeds the commons-codec dmrules.txt rule table so
# DaitchMokotoffSoundex::default() is usable; without it the crate only
# builds DM encoders from caller-supplied rules.
rphonetic = { version = "4.0.0", features = ["embedded_dm"] }
# json_repair's schema-guided validation engine: the mature Rust JSON Schema
# validator (drafts 4 through 2020-12), maintained by a core maintainer of
# Python's own `jsonschema` library, 87M+ downloads with active releases.
# The pragmatic-not-ideological dependency call: schema validation is full of
# trapdoors a hand-rolled subset gets silently wrong (draft keyword deltas,
# `pattern` regexes, `$ref` resolution, oneOf exclusivity), and this crate is
# the ecosystem's battle-tested answer. json_repair itself delegates to the
# Python `jsonschema` package for exactly this step; tors uses the Rust one.
# default-features = false: the crate's defaults pull its remote-$ref
# resolvers (reqwest + rustls + an entire TLS stack, plus a file resolver)
# for schemas that $ref out to URLs and files; tors resolves LOCAL `#/...`
# JSON pointers only — json_repair's SchemaRepairer raises on any other $ref
# spelling, and tors keeps that contract — so the resolvers are pure weight.
jsonschema = { version = "0.56", default-features = false }
# The JSON interchange type the validator works over (and the shape the
# schema/`Value` boundary conversions speak). Already in the tree as
# criterion's transitive, so the direct edge adds no new package — the same
# precedent as aho-corasick and encoding_rs.
serde_json = "1"
# The random-generation surface (`src/random_impl.rs`): OsRng, the per-call
# OS CSPRNG source (getrandom/getentropy syscall) behind the unseeded
# spelling of random_string/random_hex/random_b62/random_b64url/uuid4/uuid7.
# default-features = false + os_rng only: none of rand's samplers,
# distributions, thread-rng, or SmallRng machinery is used — tors owns the
# u64 stream consumption (Lemire sampling, documented in random_impl.rs) and
# needs only the OsRng type + its RngCore::fill_bytes. MIT OR Apache-2.0.
# Already in the lock as the dev tree's transitive (criterion), so this
# direct edge adds no new package to the tree at all — the aho-corasick/
# serde_json precedent; what is new is only the base-build runtime reach:
# rand, rand_core, getrandom (the os_rng feature's platform syscall crate).
# rand_core carries the OS edge itself since 0.10 — via the rand crate
# (rand 0.10 is where rand_core 0.10's split moved OsRng/OsError, renamed
# SysRng over the sys_rng feature), so the rand edge stays but on the 0.10
# line, and the whole family is one rand_core version in the lock instead
# of two.
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
# The seeded spelling's deterministic stream: ChaCha20Rng built via
# rand_core's seed_from_u64 (the PCG32 derivation documented in
# random_impl.rs and re-implemented by the tests' oracle). default-features
# off (std unneeded — tors fills byte buffers, never samples the crate's
# own distributions). MIT OR Apache-2.0; also already in the lock (the dev
# tree's transitive), so no new package; pulls ppv-lite86 for the SSE2
# backend in addition to rand_core.
rand_chacha = { version = "0.10", default-features = false }
# rand_core's traits directly (SeedableRng::seed_from_u64, RngCore/TryRngCore,
# and the os_rng feature's OsRng handle for the unseeded spelling): the
# engine code speaks rand_core's vocabulary, not a re-export chain through
# rand or rand_chacha.
rand_core = { version = "0.10", default-features = false }
# The single-number extraction grammar behind schema-mode numeric coercion
# ("$50.0", "USD 50", "1,234.789" — one token, maximal munch, percent
# suffix). Already in the tree as the jsonschema crate's pattern-validation
# engine, so this direct edge adds no new package either; a declarative
# grammar instead of hand-rolled byte arithmetic is the robust choice here
# (comma grouping is exactly the kind of fiddly indexing that breaks on
# locale-shaped input).
regex = "1"
# ALL datetime parsing and calendar/clock validation for the date/time
# coercion: jiff's ISO/RFC-3339 parsers plus a small declarative strptime
# table for the other accepted shapes, its civil constructors as the
# calendar authority, its Display as the canonical output. MIT OR
# UNLICENSE (the memchr election precedent). default-features off with
# std only — no timezone database needed (fixed offsets + civil types).
jiff = { version = "0.2", default-features = false, features = ["std"] }
# minhash_signature's shingle hash: XXH64 (twox-hash 2.1). The dep survey
# (issue #62, 2026-09) measured the three candidates over the prose corpus
# at ~30-byte shingles: XXH64 2.1 ns/shingle vs inline FNV-1a 5.9 vs
# sha256-truncate 20.6, and found the end-to-end Jaccard-estimation quality
# statistically indistinguishable between them over 2280 controlled pairs
# (the affine stage over the Mersenne prime dominates the randomness; the
# input hash's job is injectivity, which all three provide) — so the
# fastest well-maintained one wins. XXH64 is the frozen-spec algorithm
# (final since xxHash 0.7.0, 2016: the digest for a given seed and byte
# stream is part of the spec, not an implementation detail), which is
# exactly the stability a cross-version signature contract needs; MIT
# (deny.toml's allowlist verbatim, no new entries); 240M downloads /
# 52M recent, releases into 2026-08. default-features = false with
# xxhash64+std: the crate is a ZERO-dependency leaf this way — its
# defaults pull rand (+chacha20/getrandom) for the random-builder API
# this crate never touches.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64", "std"] }
# The UUIDv7 helper trio's parse/encode engine (src/uuid_impl.rs,
# `uuid_parse`/`uuid_version`/`uuid7_timestamp_ms`): the uuid-rs org's crate,
# adopted for the hex grammar work (parse + canonical encode) per the
# maintainer policy of preferring a maintained, compliant crate over
# hand-rolling. Apache-2.0 OR MIT, passes deny.toml's allowlist through SPDX
# expression evaluation with no config change. default-features = false:
# parse_str/from_bytes/get_version_num/hyphenated().encode_lower need NO
# features, verified `cargo tree` shows zero transitive dependencies in this
# config; the generation features (v4/v7/rng) stay off on the library path —
# the random-generation family's uuid4/uuid7 draw their bytes from tors's
# own rng and hand them to the crate's zero-feature builders
# (`Builder::from_random_bytes` for v4, `Builder::from_unix_timestamp_millis`
# for v7; the v4/v7/rng flags gate only the crate's own-rng `new_v4`/`now_v7`
# constructors, which tors does not call), and the field-reading trio reads
# fields back out with no generator at all. The strict-canonical CONTRACT stays
# tors's own thin layer on top: the crate's parse_str deliberately accepts
# the loose forms tors rejects (braces, urn:, hyphen-less, uppercase), so
# tors enforces strictness by canonical-encoding equality — input must be
# byte-equal to the parsed value's re-encoded canonical form — and keeps its
# own error taxonomy/position finding (uuid_impl.rs's module doc). The caret
# floor is 1.26 (caret + boundary-test posture: >=1.26, <2.0, with the
# crate-adoption boundary pinned from both sides in src/uuid_impl.rs and
# tests/test_uuid.py so a uuid 1.x grammar move fails as a boundary move);
# the random-generation branch's own `uuid = "1"` line — same zero features
# — deduped into this one at the merge, the stricter floor subsuming it.
uuid = { version = "1.26", default-features = false }
# The whole PDF surface (`pdf_extract`/`pdf_page_count`, `src/pdf_impl.rs`):
# open + per-page text + markdown conversion, called directly under
# `py.detach` — the crate ships pyo3 bindings of its own, but that wheel
# measures as GIL-held per call (worst heartbeat gap 23.6ms on a 9-page
# doc, 2026-09, growing with document size), which is the exact hazard a
# tors surface exists to remove, so the Rust API is used instead and the
# pass runs detached. MIT OR Apache-2.0; MSRV 1.88 (under this crate's
# 1.90 floor); pure Rust, `Send + Sync` document type, 100% pass rate on
# the 3,830-PDF veraPDF/pdf.js/SafeDocs corpora per its published
# benchmark. Default features only — no `rendering` (tiny-skia/JBIG2), no
# `signatures`, no `python`/`pyo3` (this crate IS the binding), no
# `parallel`; the image/table/font stacks that remain are unconditional
# upstream dependencies, not options. The caret on "0.3.78" bounds to
# <0.4: 0.x minors carry breaking changes, and this crate should take
# them deliberately, not through a plain `cargo update`.
pdf_oxide = { version = "0.3.78", optional = true }
# The rest of the documents surface (doc/docx/xls/xlsx/ppt/pptx, rtf, odt/ods/odp,
# epub, csv) — firecrawl's converter: one document model + one GFM serializer
# across all of them, content-based format detection, typed errors including
# NeedsOcr { pages } (page-precise OCR routing). MIT, MSRV 1.88, no cargo
# features of its own (one build shape). Measured head-to-head against
# office_oxide (already compiled in via pdf_oxide's tree, 2026-09): anydoc
# renders style-based docx headings and list markers that office_oxide drops
# entirely, and covers rtf/odt/epub/csv office_oxide cannot read at all; its
# one measured loss is cosmetic (& is HTML-escaped in its markdown output,
# which tors's strip normalizes back). Its own PDF path (pdf-inspector)
# measured WORSE than pdf_oxide on columns/links, which is why PDF routes to
# pdf_oxide and anydoc handles everything else. The caret bounds to <0.3.
anydoc = { version = "0.2.4", optional = true }
# The `backend="oxide"` lane of the documents surface (`src/documents_impl.rs`):
# office_oxide's DOCX/XLSX/PPTX (+ legacy DOC/XLS/PPT) reader — the caller-
# selectable alternative to anydoc's, exposed so downstream pipelines can
# diff the two engines' output on their own corpora. MIT OR Apache-2.0,
# MSRV 1.88. NOT weight: pdf_oxide already compiles it in as a normal
# dependency, so this direct edge adds no new package to the tree — only a
# direct API edge to code already there (the same precedent as
# aho-corasick and encoding_rs, both promoted from lock transitives). The
# anydoc-vs-office_oxide routing default lives in documents_impl's docs.
office_oxide = { version = "0.1.10", optional = true }
# The HTML lane of the documents surface (`src/documents_impl.rs`): neither
# anydoc nor office_oxide reads HTML, so the lane has its own engine.
# html-to-markdown-rs (MIT, xberg-io, 1.2M downloads) is the measured pick
# over the alternatives (2026-09, over a polluted-head fixture — title,
# <style>, <script> — plus headings/bold/italic/hyperlink/nested-lists/
# GFM-table/blockquote/code-fence/entities/CJK/emoji): it drops <script>/
# <style> BY CONSTRUCTION (htmd routes them through its generic block
# handler, leaking CSS/JS text into the body markdown — architectural, not
# a bugfix away; downstream web-ingestion pipelines feed on this IR, so
# noise text in it is disqualifying), emits padded GFM tables WITH the `|---|` delimiter row
# (fast_html2md omits it — not valid GFM), indents nested lists, decodes
# entities fully, and keeps code fences clean. Its two quirks are
# option-level, not architectural, and both are handled at the call site:
# the <title> would become YAML frontmatter (suppressed by
# `extract_metadata: false`, verified) and mixed `-`/`*` list markers
# (cosmetic; the GFM strip pass handles either).
# default-features = false: the optional cargo features (axum/tokio/rmcp/
# schemars/serde/image — an HTTP-serving + MCP + image stack) are pure
# weight for this lane. The caret bounds to <4.
html-to-markdown-rs = { version = "3.12", default-features = false, optional = true }
# Inflate for the PDF depth pre-scan's compressed-object layer
# (`src/pdf_impl.rs` `scan_stream_object`): a /Type /ObjStm or /Type /XRef
# payload is a FlateDecode stream whose CONTENTS pdf_oxide parses with the
# same uncapped recursive object parser as raw bytes (its objstm.rs:168
# `parse_object`), so the raw-byte nesting walk cannot see a bomb hidden
# there without inflating first. NOT weight and NOT new: flate2 is already
# in the lock as pdf_oxide's own decoder (its Cargo.toml [dependencies.flate2],
# the same zlib-rs backend, default-features off): this is a direct API edge
# to code already compiled in (the aho-corasick precedent, see office_oxide
# above). Optional behind `documents` for the same reason pdf_oxide is.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }

[features]
default = ["extension-module"]
# Kept optional (not baked into the pyo3 dependency directly) because `extension-module`
# does not link libpython, which breaks a plain `cargo test`/`cargo build` binary target;
# maturin enables the default feature set, `cargo test --no-default-features` skips it.
extension-module = ["pyo3/extension-module"]
# The document-format extraction surface (the tors-core cores
# `src/pdf_impl.rs`, `src/documents_impl.rs`, `src/gfm_strip_impl.rs`
# behind the feature, and the pyo3 bindings `tors-documents/src/lib.rs`):
# pdf_oxide for PDF, html-to-markdown-rs for HTML, anydoc for
# every other working format, office_oxide as the selectable oxide backend
# for the OOXML/legacy office formats. Optional so Rust consumers of
# `tors-core` stay lean; the Python side ships it as the SECOND wheel —
# tors-documents, whose Cargo.toml path-deps on this crate with
# features = ["documents"] and wraps the cores in pyo3 bindings, installed
# by `pip install tors[documents]` and re-exported as tors.documents. The
# base wheel builds with the feature off: it carries none of the engine
# weight, and the split is what keeps both downstream pipelines (one
# documents-heavy, one not) on one dependency line each.
documents = ["dep:pdf_oxide", "dep:anydoc", "dep:office_oxide", "dep:html-to-markdown-rs", "dep:flate2"]

[dev-dependencies]
criterion = "0.8"
strsim = "0.11.1"
# The random bench's uuid4 comparator only: `Uuid::new_v4()` (the crate's
# own getrandom-per-call rng path — verified in its source; the
# thread-cached engine is the separate opt-in fast-rng feature) is what
# benches/random.rs measures the per-call-OsRng design against. The v4
# feature pulls only uuid's `rng` (getrandom, already in the lock) — and
# because this is a dev-dependency, the features unify ONLY into
# test/bench builds: the published crate's uuid stays the zero-feature
# builder set the library path uses.
uuid = { version = "1", features = ["v4"] }

