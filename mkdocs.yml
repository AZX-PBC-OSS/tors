site_name: tors
site_description: Fast, GIL-free text operations for Python, backed by Rust
site_url: https://azx-pbc-oss.github.io/tors/
repo_url: https://github.com/AZX-PBC-OSS/tors
repo_name: AZX-PBC-OSS/tors

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - API reference: api.md
  - Recipes:
      - Ingesting a real document: recipe-ingest.md
      - A lightweight retrieval/reranking pipeline: recipe-retrieval.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
